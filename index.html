<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5fcf7">
  <meta name="description" content="イオン式とイオン結合性化合物の組成式を、電荷のつり合いから学ぶWebアプリ">
  <title>IonicFormula</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="app-header" class="app-header">
    <a id="brand" class="brand" href="./" aria-label="IonicFormula ホーム">IonicFormula</a>
    <div id="quiz-actions" class="quiz-actions" hidden>
      <button id="hint-button" class="top-action" type="button">ヒント</button>
      <button id="pass-button" class="top-action" type="button">パス</button>
      <button id="quit-button" class="top-action" type="button">タイトル</button>
    </div>
    <div class="media-controls" aria-label="効果音・画面演出">
      <button id="sound-toggle" class="media-toggle" type="button" aria-label="効果音を切り替える" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="sound-wave" d="M16 9.5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10"/></svg><span>SE</span>
      </button>
      <button id="vfx-toggle" class="media-toggle" type="button" aria-label="画面演出を切り替える" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 1.45 6.55L20 10l-6.55 1.45L12 18l-1.45-6.55L4 10l6.55-1.45z"/><path d="m18 16 .55 2.45L21 19l-2.45.55L18 22l-.55-2.45L15 19l2.45-.55z"/></svg><span>FX</span>
      </button>
    </div>
  </header>

  <main class="app-shell">
    <div id="session-announcement" class="session-announcement" role="status" hidden></div>
    <section id="setup-screen" class="screen" aria-labelledby="setup-title">
      <h1 id="setup-title" class="sr-only">IonicFormula</h1>
      <form id="setup-form" class="setup-form">
        <fieldset class="choice-section">
          <legend class="sr-only">問題の種類</legend>
          <div class="mode-grid">
            <label class="mode-card">
              <input type="radio" name="practice-type" value="ion" checked>
              <span class="mode-icon" aria-hidden="true">Na<sup>＋</sup></span>
              <strong>イオンの学習</strong>
            </label>
            <label class="mode-card">
              <input type="radio" name="practice-type" value="ionFormula">
              <span class="mode-icon" aria-hidden="true">Ca<sup>2＋</sup>＋Cl<sup>－</sup></span>
              <strong>イオン式から解答</strong>
            </label>
            <label class="mode-card">
              <input type="radio" name="practice-type" value="ionName">
              <span class="mode-icon name-icon" aria-hidden="true">陽＋陰</span>
              <strong>イオン名から解答</strong>
            </label>
            <label class="mode-card">
              <input type="radio" name="practice-type" value="random">
              <span class="mode-icon" aria-hidden="true">?</span>
              <strong>ランダム出題</strong>
            </label>
          </div>
        </fieldset>

        <fieldset class="choice-section compact-choice">
          <legend class="sr-only">難易度</legend>
          <div class="segment-control two">
            <label><input type="radio" name="difficulty" value="normal" checked><span>ノーマル</span></label>
            <label><input type="radio" name="difficulty" value="hard"><span>ハード</span></label>
          </div>
        </fieldset>

        <fieldset class="choice-section compact-choice">
          <legend class="sr-only">問題数</legend>
          <div class="segment-control two">
            <label><input type="radio" name="question-count" value="10" checked><span>10問</span></label>
            <label><input type="radio" name="question-count" value="endless"><span>エンドレス</span></label>
          </div>
        </fieldset>

        <button id="start-button" class="primary-button start-button" type="submit" disabled>スタート</button>
      </form>
    </section>

    <section id="quiz-screen" class="screen" hidden aria-labelledby="variant-label">
      <p id="variant-label" class="sr-only"></p>
      <article id="question-card" class="question-card">
        <div class="question-number"><span id="question-number">1</span><span id="question-total"> / 10</span></div>
        <div id="question-prompt" class="question-prompt"></div>
        <p id="streak" class="streak" aria-live="polite"></p>
      </article>

      <form id="answer-form" class="answer-area" autocomplete="off">
        <label id="answer-label" class="sr-only" for="answer-input">答え</label>
        <div class="answer-composer">
          <input id="answer-input" type="text" enterkeyhint="done" autocapitalize="off" autocomplete="off" spellcheck="false">
          <button id="submit-answer" class="answer-submit" type="submit" aria-label="回答を判定"><span id="submit-answer-text">✓</span></button>
        </div>
        <p id="input-message" class="input-message"></p>
      </form>

      <div id="name-shortcuts" class="name-shortcuts" hidden aria-label="名称入力補助">
        <button type="button" data-key="（">（</button>
        <button type="button" data-key="）">）</button>
        <button type="button" data-key="Ⅰ">Ⅰ</button>
        <button type="button" data-key="Ⅱ">Ⅱ</button>
        <button type="button" data-key="Ⅲ">Ⅲ</button>
        <button type="button" data-key="イオン">イオン</button>
      </div>

      <div id="formula-keyboard" class="formula-keyboard" hidden aria-label="化学式入力キーボード">
        <div id="number-keys" class="key-row number-keys"></div>
        <div id="letter-keys" class="letter-keys"></div>
        <div class="keyboard-controls">
          <div id="charge-keys" class="charge-keys" hidden></div>
          <button type="button" data-key-action="left" aria-label="カーソルを左へ">←</button>
          <button type="button" data-key-action="right" aria-label="カーソルを右へ">→</button>
          <button type="button" data-key-action="clear">クリア</button>
        </div>
      </div>

      <div id="feedback" class="feedback" aria-live="polite" hidden>
        <div id="feedback-title" class="feedback-title"></div>
        <div id="feedback-answer" class="feedback-answer"></div>
        <p id="feedback-detail" class="feedback-detail"></p>
        <button id="next-button" class="primary-button" type="button" hidden>次へ</button>
      </div>
    </section>

    <section id="result-screen" class="screen" hidden aria-labelledby="result-title">
      <div class="result-hero">
        <span class="result-mark" aria-hidden="true">✓</span>
        <h1 id="result-title">今回の結果</h1>
      </div>
      <dl class="result-grid">
        <div><dt>初回正解</dt><dd id="result-first">0</dd></div>
        <div><dt>再回答正解</dt><dd id="result-retry">0</dd></div>
        <div><dt>ヒント使用</dt><dd id="result-hint">0</dd></div>
        <div><dt>パス</dt><dd id="result-pass">0</dd></div>
      </dl>
      <div id="result-categories" class="result-categories"></div>
      <div class="result-actions">
        <button id="retry-session" class="primary-button" type="button">同じ設定でもう一度</button>
        <button id="back-to-setup" class="secondary-button" type="button">タイトルへ戻る</button>
      </div>
    </section>
  </main>

  <div id="spark-layer" class="spark-layer" aria-hidden="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
