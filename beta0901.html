<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5fcf7">
  <meta name="description" content="イオン式とイオン結合性化合物の組成式を、電荷のつり合いから学ぶWebアプリのベータ版">
  <title>IonicFormula β</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="beta0901" data-build="beta0901">
  <header id="app-header" class="app-header">
    <a id="brand" class="brand" href="beta0901.html" aria-label="IonicFormula ベータ ホーム">IonicFormula <span aria-hidden="true">β</span></a>
    <div id="quiz-actions" class="quiz-actions" hidden>
      <button id="quit-button" class="home-button" type="button" aria-label="ホーム画面に戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10 8.5-7 8.5 7V21H15v-6H9v6H3.5z"/></svg>
      </button>
    </div>
    <div class="media-controls" aria-label="効果音">
      <button id="sound-toggle" class="media-toggle" type="button" aria-label="効果音を切り替える" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="sound-wave" d="M16 9.5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10"/></svg><span>SE</span>
      </button>
    </div>
  </header>

  <main class="app-shell">
    <section id="setup-screen" class="screen" aria-labelledby="setup-title">
      <h1 id="setup-title" class="sr-only">IonicFormula ベータ</h1>
      <form id="setup-form" class="setup-form">
        <fieldset class="choice-section">
          <legend class="sr-only">問題の種類</legend>
          <div class="mode-grid mode-grid-two">
            <label class="mode-card">
              <input type="radio" name="practice-type" value="ion" checked>
              <span class="mode-icon"><span class="mode-formula">Na<sup>＋</sup></span><span class="mode-label">イオン</span></span>
            </label>
            <label class="mode-card">
              <input type="radio" name="practice-type" value="compound">
              <span class="mode-icon"><span class="mode-formula">(NH<sub>4</sub>)<sub>2</sub>S</span><span class="mode-label">化合物</span></span>
            </label>
          </div>
        </fieldset>

        <fieldset id="compound-options" class="choice-section compound-options" hidden>
          <legend>化合物の出題設定</legend>
          <div class="compound-preset-heading">
            <span class="compound-option-title">答え方</span>
            <p id="compound-preset-description" class="compound-preset-description">組成式または化合物名を1つ答えます。</p>
          </div>
          <div id="compound-answer-presets" class="compound-answer-presets" role="group" aria-label="化合物の答え方">
            <button type="button" class="compound-preset is-on" data-compound-preset="random" aria-pressed="true">おまかせ</button>
            <button type="button" class="compound-preset" data-compound-preset="formula" aria-pressed="false">組成式</button>
            <button type="button" class="compound-preset" data-compound-preset="name" aria-pressed="false">化合物名</button>
            <button type="button" class="compound-preset" data-compound-preset="both" aria-pressed="false">式＆名</button>
          </div>
          <details id="compound-prompt-details" class="compound-prompt-details">
            <summary>出題の見せ方</summary>
            <div class="option-toggles" role="group" aria-label="化合物の出題形式">
              <button type="button" class="option-toggle is-on" data-compound-toggle="promptFormula" aria-pressed="true">イオン式</button>
              <button type="button" class="option-toggle is-on" data-compound-toggle="promptName" aria-pressed="true">イオン名</button>
            </div>
          </details>
          <p id="compound-option-message" class="compound-option-message" role="status"></p>
        </fieldset>

        <fieldset class="choice-section compact-choice">
          <legend class="sr-only">難易度</legend>
          <div class="segment-control two">
            <label><input type="radio" name="difficulty" value="normal" checked><span>やさしめ</span></label>
            <label><input type="radio" name="difficulty" value="hard"><span>ややむず</span></label>
          </div>
        </fieldset>

        <fieldset class="choice-section compact-choice">
          <legend class="sr-only">問題数</legend>
          <div class="segment-control three">
            <label><input type="radio" name="question-count" value="10" checked><span>10問</span></label>
            <label><input type="radio" name="question-count" value="endless"><span>エンドレス</span></label>
            <label><input type="radio" name="question-count" value="weak"><span>苦手</span></label>
          </div>
        </fieldset>

        <div class="start-actions">
          <button id="start-button" class="primary-button start-button" type="submit" disabled>スタート</button>
          <button id="weak-review-button" class="weak-review-button" type="button" aria-label="苦手問題を確認" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"></circle><path d="m7.8 9.4 2.3 2.1m0-2.1-2.3 2.1M13.9 9.4l2.3 2.1m0-2.1-2.3 2.1M8.3 15.7c1.1-1 2.3-1.5 3.7-1.5s2.6.5 3.7 1.5"></path></svg>
            <span id="weak-review-count" class="weak-review-count" hidden>0</span>
          </button>
        </div>
      </form>
    </section>

    <section id="quiz-screen" class="screen" hidden aria-labelledby="variant-label">
      <p id="variant-label" class="sr-only"></p>
      <article id="question-card" class="question-card">
        <div class="question-number"><span id="question-number">1</span><span id="question-total"> / 10</span></div>
        <div id="question-prompt" class="question-prompt"></div>
        <p id="streak" class="streak" aria-live="polite"></p>
      </article>
      <div id="question-progress" class="question-progress" role="progressbar" aria-label="問題の進み具合" aria-valuemin="1" hidden>
        <span id="question-progress-bar" class="question-progress-bar"></span>
        <span id="question-progress-label" class="sr-only"></span>
      </div>

      <form id="answer-form" class="answer-area" autocomplete="off">
        <label id="answer-label" class="sr-only" for="answer-input">答え</label>
        <div id="both-answer-tabs" class="both-answer-tabs" hidden aria-label="式と名称の解答手順">
          <button type="button" data-both-field="formula">① 組成式</button>
          <button type="button" data-both-field="name">② 化合物名</button>
        </div>
        <div id="answer-composer" class="answer-composer">
          <input id="answer-input" type="text" enterkeyhint="done" autocapitalize="off" autocomplete="off" spellcheck="false">
          <div id="formula-render" class="formula-render" aria-hidden="true" hidden></div>
          <button id="submit-answer" class="answer-submit" type="submit" aria-label="回答を判定"><span id="submit-answer-text">✓</span></button>
        </div>
        <p id="input-message" class="input-message"></p>
      </form>

      <div id="name-shortcuts" class="name-shortcuts" hidden aria-label="名称入力補助">
        <button type="button" data-key="(Ⅰ)">(Ⅰ)</button>
        <button type="button" data-key="(Ⅱ)">(Ⅱ)</button>
        <button type="button" data-key="(Ⅲ)">(Ⅲ)</button>
        <button type="button" data-key="(Ⅳ)">(Ⅳ)</button>
        <button type="button" data-key="イオン">イオン</button>
        <button type="button" class="name-clear" data-key-action="clear">クリア</button>
      </div>

      <div id="formula-keyboard" class="formula-keyboard" hidden aria-label="化学式入力キーボード">
        <div id="number-keys" class="key-row number-keys"></div>
        <div id="letter-keys" class="letter-keys"></div>
        <div class="keyboard-controls">
          <div id="charge-keys" class="charge-keys" hidden></div>
          <button type="button" data-key-action="left" aria-label="カーソルを左へ">←</button>
          <button type="button" data-key-action="right" aria-label="カーソルを右へ">→</button>
          <button type="button" data-key-action="clear">クリア</button>
        </div>
      </div>

      <div id="feedback" class="feedback" aria-live="polite" hidden>
        <div id="feedback-title" class="feedback-title"></div>
        <div id="feedback-answer" class="feedback-answer"></div>
        <div id="feedback-companion" class="feedback-companion" hidden>
          <span id="feedback-companion-label" class="feedback-companion-label"></span>
          <span id="feedback-companion-value" class="feedback-companion-value"></span>
        </div>
        <button id="feedback-companion-toggle" class="companion-toggle" type="button" aria-pressed="true" aria-controls="feedback-companion" hidden></button>
        <p id="feedback-detail" class="feedback-detail"></p>
        <div id="feedback-actions" class="feedback-actions" hidden>
          <button id="hint-button" class="support-action" type="button">ヒント</button>
          <button id="pass-button" class="support-action" type="button">パス</button>
        </div>
        <button id="next-button" class="primary-button" type="button" hidden>次へ</button>
      </div>
    </section>

    <section id="result-screen" class="screen" hidden aria-labelledby="result-title">
      <div class="result-hero">
        <span class="result-mark" aria-hidden="true">✓</span>
        <h1 id="result-title">今回の結果</h1>
        <p id="result-first-rate" class="result-first-rate"></p>
        <p id="result-comparison" class="result-comparison"></p>
      </div>
      <dl class="result-grid">
        <div><dt>初回で正解</dt><dd id="result-first">0</dd></div>
        <div><dt>誤答後に正解</dt><dd id="result-retry">0</dd></div>
        <div><dt>ヒント使用</dt><dd id="result-hint">0</dd></div>
        <div><dt>パス</dt><dd id="result-pass">0</dd></div>
      </dl>
      <p id="result-count-note" class="result-count-note">ヒント使用は、誤答後に正解した問題と重なる場合があります。</p>
      <section id="result-review" class="result-review" hidden aria-labelledby="result-review-title">
        <div class="result-review-heading">
          <h2 id="result-review-title">復習する問題</h2>
          <button id="result-review-companion-toggle" class="companion-toggle" type="button" aria-pressed="true" hidden></button>
        </div>
        <div id="result-review-list" class="result-review-list"></div>
      </section>
      <div class="result-actions">
        <button id="retry-session" class="primary-button" type="button">同じ設定でもう一度</button>
        <button id="back-to-setup" class="secondary-button" type="button">ホーム画面へ戻る</button>
      </div>
    </section>
  </main>

  <dialog id="weak-review-dialog" class="weak-review-dialog" aria-labelledby="weak-review-title">
    <div class="weak-review-sheet">
      <div class="weak-review-heading">
        <div><p class="weak-review-kicker">復習リスト</p><h2 id="weak-review-title">苦手問題</h2></div>
        <button id="close-weak-review" class="modal-close" type="button" aria-label="苦手問題を閉じる">×</button>
      </div>
      <p class="weak-review-description">苦手スコアが残っている問題です。初回正答率が低い順に表示します。</p>
      <p id="weak-review-empty" class="weak-review-empty" hidden>まだ苦手問題はありません。最初の一問を気軽に始めよう。</p>
      <div id="weak-review-list" class="weak-review-list"></div>
      <button id="start-weak-from-review" class="primary-button" type="button">苦手モードで始める</button>
    </div>
  </dialog>

  <div id="spark-layer" class="spark-layer" aria-hidden="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
